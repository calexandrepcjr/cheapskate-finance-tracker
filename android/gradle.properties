# gradle.properties
#
# Project-wide Gradle configuration properties.
# These settings tune the Gradle daemon and Android build performance.
#
# Reference: https://docs.gradle.org/current/userguide/build_environment.html

# ── JVM heap for the Gradle daemon ───────────────────────────────────────────
# 2 GB is sufficient for a single-module project; increase to 4g for large projects.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── Gradle daemon ─────────────────────────────────────────────────────────────
# Reuse a long-lived JVM process across builds for faster incremental builds.
org.gradle.daemon=true

# ── Parallel execution ────────────────────────────────────────────────────────
# Build independent modules in parallel (useful when more modules are added later).
org.gradle.parallel=true

# ── Build caching ─────────────────────────────────────────────────────────────
# Cache task outputs so unchanged tasks are skipped on subsequent builds.
org.gradle.caching=true

# ── AndroidX ─────────────────────────────────────────────────────────────────
# Opt in to AndroidX (required for modern Jetpack libraries).
android.useAndroidX=true

# ── Kotlin code style ─────────────────────────────────────────────────────────
kotlin.code.style=official

# ── R8 / ProGuard ─────────────────────────────────────────────────────────────
# Use the full R8 mode (default since AGP 7.x, explicit for clarity).
android.enableR8.fullMode=true
